<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" class="pt-svg" role="img" aria-label="Animated toy: the probabilities a language model gives to five possible replies, before and after each stage of post-training."><rect x="0" y="0" width="460" height="50" fill="#f7f8f7" rx="8"/><text class="pf-t pf-m" x="14" y="21" font-size="12">User</text><text class="pf-t pf-h" x="14" y="40" font-size="16">What is the capital of France?</text><text class="pf-t pf-m" x="0" y="68" font-size="12">Probability of each whole reply</text><g transform="translate(0 275.1)"><text class="pf-t" x="0" y="15" font-size="14">What is the capital of Germany?</text><rect x="0" y="23" width="280" height="12" fill="#eef0f3" rx="3"/><rect x="0" y="23" width="2.8" height="12" fill="#00929a" rx="3" opacity="0.55"/><text class="pf-t pf-m" x="290" y="34" font-size="14">1%</text><text class="pf-t pf-m" x="332" y="34" font-size="11.5">continues the quiz</text></g><g transform="translate(0 226)"><text class="pf-t" x="0" y="15" font-size="14">France is a country in Western Europe, bordered by…</text><rect x="0" y="23" width="280" height="12" fill="#eef0f3" rx="3"/><rect x="0" y="23" width="8.4" height="12" fill="#00929a" rx="3" opacity="0.55"/><text class="pf-t pf-m" x="290" y="34" font-size="14">3%</text><text class="pf-t pf-m" x="332" y="34" font-size="11.5">keeps writing</text></g><g transform="translate(0 126)"><text class="pf-t" x="0" y="15" font-size="14">Paris.</text><rect x="0" y="23" width="280" height="12" fill="#eef0f3" rx="3"/><rect x="0" y="23" width="47.6" height="12" fill="#00929a" rx="3" opacity="0.55"/><text class="pf-t pf-m" x="290" y="34" font-size="14">17%</text><text class="pf-t pf-m" x="332" y="34" font-size="11.5">answers</text></g><g transform="translate(0 76)"><text class="pf-t pf-h" x="0" y="15" font-size="14">The capital of France is Paris.</text><rect x="0" y="23" width="280" height="12" fill="#eef0f3" rx="3"/><rect x="0" y="23" width="207.2" height="12" fill="#00929a" rx="3" opacity="1"/><text class="pf-t pf-h pf-strong" x="290" y="34" font-size="14">74%</text><text class="pf-t pf-m" x="332" y="34" font-size="11.5">answers in full</text></g><g transform="translate(0 176.9)"><text class="pf-t" x="0" y="15" font-size="14">Lyon.</text><rect x="0" y="23" width="280" height="12" fill="#eef0f3" rx="3"/><rect x="0" y="23" width="14" height="12" fill="#00929a" rx="3" opacity="0.55"/><text class="pf-t pf-m" x="290" y="34" font-size="14">5%</text><text class="pf-t pf-m" x="332" y="34" font-size="11.5">wrong</text></g></svg>
