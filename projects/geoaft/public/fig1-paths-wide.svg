<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" role="img" aria-labelledby="fig1w-title" class="geo-svg" width="980" height="340"><title id="fig1w-title">Diagram: attention computes token states, projections, representations q and k, a compatibility score s(q,k), and a softmax. Conventional PEFT edits the projections, which changes scores indirectly. GeoAFT adds a trainable term to the compatibility score itself and leaves q and k unchanged.</title><style>
.gf-t{font-family:'QRS Frutiger','Frutiger','Segoe UI',Inter,system-ui,sans-serif;fill:#374151;font-weight:300}
.gf-h{fill:#11182c;font-weight:400}.gf-m{fill:#6b7280}.gf-strong{font-weight:600}
.gf-x{font-family:'STIX Two Math','Cambria Math','Latin Modern Math','Times New Roman',serif;font-style:italic;fill:#11182c}
.gf-xr{font-family:'STIX Two Math','Cambria Math','Latin Modern Math','Times New Roman',serif;fill:#11182c}
</style><defs><marker id="f1d-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6b7280"/></marker><marker id="f1d-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#00929a"/></marker><marker id="f1d-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c05f0c"/></marker></defs>
<rect x="10" y="128" width="140" height="74" rx="10" fill="#fff" stroke="#cfd4dc" stroke-width="1.4"/>
<text class="gf-t gf-h" x="80.0" y="161.0" font-size="15.5" text-anchor="middle" style="fill:#11182c">Token states</text>
<text class="gf-x" x="80.0" y="182.0" font-size="14" text-anchor="middle"><tspan>x</tspan></text>
<line x1="154" y1="165.0" x2="184" y2="165.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f1d-m)"/>
<rect x="190" y="128" width="170" height="74" rx="10" fill="#fbeee2" stroke="#c05f0c" stroke-width="1.4"/>
<text class="gf-t gf-h" x="275.0" y="161.0" font-size="15.5" text-anchor="middle" style="fill:#11182c">Projections</text>
<text class="gf-x" x="275.0" y="182.0" font-size="14" text-anchor="middle">W<tspan baseline-shift="sub" font-size="10">Q</tspan>, W<tspan baseline-shift="sub" font-size="10">K</tspan></text>
<line x1="364" y1="165.0" x2="394" y2="165.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f1d-m)"/>
<rect x="400" y="128" width="150" height="74" rx="10" fill="#fff" stroke="#cfd4dc" stroke-width="1.4"/>
<text class="gf-t gf-h" x="475.0" y="161.0" font-size="15.5" text-anchor="middle" style="fill:#11182c">Representations</text>
<text class="gf-x" x="475.0" y="182.0" font-size="14" text-anchor="middle">q, k</text>
<line x1="554" y1="165.0" x2="584" y2="165.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f1d-m)"/>
<rect x="590" y="128" width="180" height="74" rx="10" fill="#e2f3f3" stroke="#00929a" stroke-width="1.4"/>
<text class="gf-t gf-h" x="680.0" y="161.0" font-size="15.5" text-anchor="middle" style="fill:#11182c">Compatibility</text>
<text class="gf-x" x="680.0" y="182.0" font-size="14" text-anchor="middle">s(q, k)</text>
<line x1="774" y1="165.0" x2="804" y2="165.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f1d-m)"/>
<rect x="810" y="128" width="160" height="74" rx="10" fill="#fff" stroke="#cfd4dc" stroke-width="1.4"/>
<text class="gf-t gf-h" x="890.0" y="161.0" font-size="15.5" text-anchor="middle" style="fill:#11182c">Attention</text>
<text class="gf-t gf-m" x="890.0" y="182.0" font-size="14" text-anchor="middle">softmax over keys</text>
<text class="gf-t gf-strong" x="275" y="28" font-size="15" text-anchor="middle" style="fill:#93480a">Conventional PEFT</text>
<text class="gf-xr" x="275" y="52" font-size="15" text-anchor="middle"><tspan font-style="italic">W</tspan> + Δ<tspan font-style="italic">W</tspan>  (e.g. LoRA: Δ<tspan font-style="italic">W = BA</tspan>)</text>
<text class="gf-t gf-m" x="275" y="76" font-size="13.5" text-anchor="middle">changes how q and k are produced</text>
<line x1="275" y1="86" x2="275" y2="122" stroke="#c05f0c" stroke-width="1.8" marker-end="url(#f1d-o)"/>
<line x1="680" y1="262" x2="680" y2="208" stroke="#00929a" stroke-width="1.8" marker-end="url(#f1d-t)"/>
<text class="gf-t gf-strong" x="680" y="282" font-size="15" text-anchor="middle" style="fill:#006f76">GeoAFT</text>
<text class="gf-x" x="680" y="304" font-size="15" text-anchor="middle">s(q, k) + α g<tspan baseline-shift="sub" font-size="10">φ</tspan>(q, k)</text>
<text class="gf-t gf-m" x="680" y="326" font-size="13.5" text-anchor="middle">changes how q and k are compared</text>
<path d="M 360 110 C 470 70, 600 70, 660 120" fill="none" stroke="#c05f0c" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity=".7" marker-end="url(#f1d-o)"/>
<text class="gf-t gf-m" x="520" y="70" font-size="12.5" text-anchor="middle">scores change indirectly</text></svg>
