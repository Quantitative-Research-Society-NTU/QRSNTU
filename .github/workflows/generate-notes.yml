name: Generate Notes JSON

on:
  push:
    paths:
      - 'Notes/**'
  workflow_dispatch:

concurrency:
  group: generate-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NOTES_VERSION: '1.2'   # <--- bump manually
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate courses JSON
        run: node .github/scripts/generate-courses.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Website/v1/courses.json
          if git diff --staged --quiet; then
            echo "courses.json unchanged"
            exit 0
          fi
          git commit -m "Auto-update courses.json"
          # The branch may have moved since checkout (e.g. two PRs merged back to back),
          # so rebase onto it and retry instead of failing on a non-fast-forward push.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not push courses.json after 3 attempts" >&2
          exit 1
