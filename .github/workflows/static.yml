name: Deploy site to GitHub Pages

# The site is plain static files in site/. tools/build.py regenerates them and tools/check.py
# validates them; the folder is then published as is (no Jekyll). The same two commands work on
# other hosts; see docs/hosting.md.

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'projects/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:
  # courses.json is committed by the "Generate Notes JSON" workflow, whose push does not trigger
  # this one, so deploy when it finishes successfully.
  workflow_run:
    workflows: ["Generate Notes JSON"]
    types: [ completed ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner's preinstalled Python 3 and Node are enough: the tools use standard libraries.
      - name: Build and validate
        run: |
          python3 tools/build.py
          python3 tools/check.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
